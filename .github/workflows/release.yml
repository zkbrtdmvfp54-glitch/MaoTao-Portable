name: Release Lightweight Tauri v2 (Windows, macOS & Kylin Linux)

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'src/**'
      - 'src-tauri/**'
      - 'assets/pet/**'
      - 'scripts/prepare-web.cjs'
      - 'scripts/check-windows-startup.ps1'
      - 'package*.json'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build'
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Build Windows 10/11 x64 installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVer = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($ver -ne $tauriVer -or ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$ver")) {
            throw "Installer version $tauriVer, package version $ver and tag $env:RELEASE_TAG must agree."
          }
          npx --yes @tauri-apps/cli@2 build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination "dist-release/MAOTAO-Setup-$ver-x64.exe"
      - name: Upgrade from the previous Tauri release and check startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installDir = Join-Path $env:RUNNER_TEMP 'maotao-startup-check'
          $oldSetup = Join-Path $env:RUNNER_TEMP 'MAOTAO-Setup-2.0.1-x64.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/zkbrtdmvfp54-glitch/MaoTao-Portable/releases/download/v2.0.1/MAOTAO-Setup-2.0.1-x64.exe' `
            -OutFile $oldSetup

          $legacyInstaller = Start-Process -FilePath $oldSetup -ArgumentList '/S', "/D=$installDir" -PassThru
          if (!$legacyInstaller.WaitForExit(120000)) { throw 'Previous-version installer timed out.' }
          if ($legacyInstaller.ExitCode -ne 0) { throw "Previous-version installer exited with code $($legacyInstaller.ExitCode)." }

          $uninstallRoot = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $getInstalledEntry = {
            Get-ChildItem -Path $uninstallRoot -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath } |
              Where-Object { $_.DisplayName -eq 'MAOTAO Desktop Pet' } |
              Select-Object -First 1
          }
          $beforeUpgrade = & $getInstalledEntry
          if (!$beforeUpgrade -or $beforeUpgrade.DisplayVersion -ne '2.0.1') {
            throw 'The previous Tauri release was not registered before upgrade.'
          }

          $setup = Get-ChildItem dist-release/MAOTAO-Setup-*-x64.exe | Select-Object -First 1
          $installer = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$installDir" -PassThru
          if (!$installer.WaitForExit(120000)) { throw 'Upgrade installer timed out.' }
          if ($installer.ExitCode -ne 0) { throw "Upgrade installer exited with code $($installer.ExitCode)." }

          $afterUpgrade = & $getInstalledEntry
          if (!$afterUpgrade -or $afterUpgrade.DisplayVersion -ne $ver) {
            throw "In-place upgrade did not update the registered version to $ver."
          }
          $registeredInstallDir = ([string]$afterUpgrade.InstallLocation).Trim('"').TrimEnd('\')
          if ($registeredInstallDir -ne [IO.Path]::GetFullPath($installDir).TrimEnd('\')) {
            throw "Upgrade moved to a different install directory: $registeredInstallDir"
          }
          $executablePath = Join-Path $installDir 'MAOTAO.exe'
          if (!(Test-Path -LiteralPath $executablePath)) { throw 'Upgraded MAOTAO.exe is missing.' }
          Write-Host "In-place upgrade verified: $($beforeUpgrade.DisplayVersion) -> $($afterUpgrade.DisplayVersion) at $installDir"
          ./scripts/check-windows-startup.ps1 -ExecutablePath $executablePath
      - uses: actions/upload-artifact@v4
        with:
          name: dist-win-x64
          path: dist-release/*
          if-no-files-found: error

  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac-universal
          - os: ubuntu-22.04
            platform: kylin-x64
          - os: ubuntu-24.04-arm
            platform: kylin-arm64
          - os: windows-latest
            platform: win7-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        if: matrix.platform != 'win7-x64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'mac-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        if: matrix.platform != 'win7-x64'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare lightweight web assets
        if: matrix.platform != 'win7-x64'
        run: node scripts/prepare-web.cjs

      - name: Install Linux Tauri & X11 hook dependencies
        if: startsWith(matrix.platform, 'kylin-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libx11-dev \
            libxtst-dev \
            libxi-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: Build macOS (Apple Silicon arm64 + Intel x64 DMG)
        if: matrix.platform == 'mac-universal'
        run: |
          VER=$(node -p "require('./package.json').version")
          npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin --bundles dmg
          npx --yes @tauri-apps/cli@2 build --target x86_64-apple-darwin --bundles dmg
          mkdir -p dist-release
          cp src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "dist-release/MAOTAO-macOS-${VER}-arm64.dmg"
          cp src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg "dist-release/MAOTAO-macOS-${VER}-x64.dmg"
          ls -lh dist-release

      - name: Build Kylin / Linux x64 (DEB + AppImage)
        if: matrix.platform == 'kylin-x64'
        run: |
          VER=$(node -p "require('./package.json').version")
          npx --yes @tauri-apps/cli@2 build --bundles deb,appimage
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/deb/*.deb "dist-release/MAOTAO-Kylin-${VER}-x64.deb"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "dist-release/MAOTAO-Kylin-${VER}-x64.AppImage"
          ls -lh dist-release

      - name: Build Kylin / Linux arm64 (DEB)
        if: matrix.platform == 'kylin-arm64'
        run: |
          VER=$(node -p "require('./package.json').version")
          npx --yes @tauri-apps/cli@2 build --bundles deb
          mkdir -p dist-release
          cp src-tauri/target/release/bundle/deb/*.deb "dist-release/MAOTAO-Kylin-${VER}-arm64.deb"
          ls -lh dist-release

      - name: Build Windows 7 SP1 x64 Compatible Portable (Electron 22)
        if: matrix.platform == 'win7-x64'
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          npm install --no-save electron@22.3.27 electron-builder@24.13.3 uiohook-napi@1.5.5
          npx electron-builder --win portable --x64 --config scripts/build-win7.json --publish never
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          Copy-Item "dist/MAOTAO-Win7-$ver-x64.exe" "dist-release/MAOTAO-Win7-$ver-x64.exe" -Force
          Get-ChildItem dist-release | Select-Object Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist-release/*

  release:
    needs: [windows, build]
    if: always() && !cancelled() && needs.windows.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: release-files/*
