<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>毛桃控制面板</title>
<link rel="stylesheet" href="menu.css">
</head>
<body>
<div class="shell" role="dialog" aria-label="毛桃桌面宠物控制面板">
  <header class="header" title="按住此处可拖动窗口">
    <div class="brand">
      <div class="brand-dot" id="brand-dot" aria-hidden="true"></div>
      <div class="brand-meta">
        <div class="brand-title-row">
          <span class="brand-name">毛桃桌面宠物</span>
          <span id="version-tag" class="version-tag">v1.5.0</span>
        </div>
        <div class="brand-sub">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">跨应用联动中</span>
          <span class="sep">·</span>
          <span id="stats-text">今日 0 键 / 0 击</span>
        </div>
      </div>
    </div>
    <button id="btn-close" class="icon-btn" type="button" title="关闭 (Esc)" aria-label="关闭面板">
      <svg viewBox="0 0 16 16" fill="none"><path d="M4.2 4.2L11.8 11.8M11.8 4.2L4.2 11.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
  </header>

  <nav class="dock-bar" role="tablist" aria-label="主导航">
    <button class="dock-trigger active" role="tab" data-tab="companion" type="button">
      <span id="dock-companion-dot" class="dock-swatch" aria-hidden="true"></span>
      <span>伙伴</span>
    </button>
    <button class="dock-trigger" role="tab" data-tab="focus" type="button">
      <span id="dock-focus-dot" class="dock-status-dot" aria-hidden="true"></span>
      <span id="dock-focus-label">专注</span>
    </button>
    <button class="dock-trigger" role="tab" data-tab="custom" type="button">
      <span>自定义</span>
    </button>
  </nav>

  <main class="content">
    <!-- Tab 1: 伙伴 -->
    <section class="tab-panel active" data-panel="companion">
      <div class="pop-group">
        <div class="pop-head">
          <span class="pop-label">猫咪花色</span>
          <span id="coat-label" class="pop-meta">液态黑猫</span>
        </div>
        <div id="coat-grid" class="skin-pills"></div>
      </div>

      <div class="pop-group">
        <div class="pop-head">
          <span class="pop-label">瞳色</span>
          <span id="eye-label" class="pop-meta">默认瞳色</span>
        </div>
        <div id="eye-row" class="eye-row"></div>
      </div>

      <div class="pop-group">
        <div class="pop-head"><span class="pop-label">快捷互动</span></div>
        <div class="pill-grid-3">
          <button class="pill-btn" data-action="perform" data-value="pet" type="button">摸摸头</button>
          <button class="pill-btn" data-action="perform" data-value="poke" type="button">戳鼻子</button>
          <button class="pill-btn" data-action="perform" data-value="yarn" type="button">毛线球</button>
          <button class="pill-btn" data-action="perform" data-value="butterfly" type="button">捉蝴蝶</button>
          <button class="pill-btn" data-action="perform" data-value="wash" type="button">舔爪洗脸</button>
          <button class="pill-btn" data-action="perform" data-value="sleep" type="button">打盹 / 唤醒</button>
        </div>
      </div>
    </section>

    <!-- Tab 2: 专注 -->
    <section class="tab-panel" data-panel="focus">
      <div class="pop-group">
        <div class="focus-status-row">
          <span id="focus-badge" class="status-badge">待机</span>
          <span id="focus-clock" class="focus-clock">25:00</span>
          <span id="focus-rounds" class="focus-rounds">今日 0 轮</span>
        </div>
        <div class="focus-actions">
          <button id="btn-focus-main" class="mini-btn-dark" type="button">▶ 开始专注</button>
          <button id="btn-focus-skip" class="mini-pill" type="button" disabled>跳过</button>
          <button id="btn-focus-reset" class="mini-pill" type="button" disabled>重置</button>
        </div>
      </div>

      <div class="pop-group">
        <div class="pop-head"><span class="pop-label">即时状态</span></div>
        <div class="pill-grid-2">
          <button class="pill-btn" data-action="perform" data-value="yarn" type="button">休息一下</button>
          <button class="pill-btn" data-action="perform" data-value="sleep" type="button">打盹 / 唤醒</button>
        </div>
      </div>

      <div class="pop-group">
        <details class="rhythm-details" open>
          <summary class="rhythm-summary">
            <span class="pop-label">节奏与定时休息</span>
            <span id="rhythm-meta" class="pop-meta">25/5 分</span>
          </summary>
          <div class="rhythm-body">
            <div class="pill-grid-2">
              <button class="pill-btn" data-rhythm="25,5" type="button">25 / 5</button>
              <button class="pill-btn" data-rhythm="45,10" type="button">45 / 10</button>
            </div>
            <div class="rhythm-inputs">
              <label class="num-field">
                <span>专注</span>
                <input id="input-focus-min" type="number" min="1" max="120" value="25">
                <span>分</span>
              </label>
              <label class="num-field">
                <span>休息</span>
                <input id="input-break-min" type="number" min="1" max="60" value="5">
                <span>分</span>
              </label>
            </div>
          </div>
        </details>
      </div>
    </section>

    <!-- Tab 3: 自定义 -->
    <section class="tab-panel" data-panel="custom">
      <div class="pop-group">
        <div class="pop-head">
          <span class="pop-label">整体大小</span>
          <span id="scale-readout" class="pop-meta tabular">100%</span>
        </div>
        <input id="scale-slider" class="warm-slider" type="range" min="75" max="150" step="5" value="100" aria-label="整体大小">
        <div class="scale-ticks">
          <button class="tick-btn" data-scale="0.75" type="button">75%</button>
          <button class="tick-btn" data-scale="1" type="button">100%</button>
          <button class="tick-btn" data-scale="1.25" type="button">125%</button>
          <button class="tick-btn" data-scale="1.5" type="button">150%</button>
        </div>
      </div>

      <div class="pop-group">
        <div class="pop-head"><span class="pop-label">配饰样式</span></div>
        <div id="acc-row" class="pill-grid-3"></div>
        <div class="pop-head" style="margin-top:4px;">
          <span class="pop-label">配饰配色</span>
          <span id="acc-color-label" class="pop-meta">默认原色</span>
        </div>
        <div id="acc-color-row" class="eye-row"></div>
      </div>

      <div class="pop-group">
        <div class="pop-head"><span class="pop-label">键鼠主题</span></div>
        <div id="kb-style-row" class="theme-grid"></div>
      </div>

      <div class="pop-group">
        <div class="pop-head">
          <span class="pop-label">交互与隐私</span>
          <span class="pop-meta">Alt+Shift+P 隐私</span>
        </div>
        <div class="pill-grid-3">
          <button id="pill-link" class="pill-btn" data-action="toggleInput" type="button">跨应用联动</button>
          <button class="pill-btn" data-toggle="showKeyChips" type="button">按键字母</button>
          <button class="pill-btn" data-toggle="numpad" type="button">数字键盘</button>
          <button class="pill-btn" data-toggle="keySound" type="button">键盘音效</button>
          <button class="pill-btn" data-toggle="leftMouse" type="button">左手鼠标</button>
          <button class="pill-btn" data-toggle="privacyMode" type="button">隐私模式</button>
          <button class="pill-btn" data-toggle="keyboard" type="button">显示键鼠</button>
          <button class="pill-btn" data-toggle="clickThrough" type="button">点击穿透</button>
          <button id="chip-top" class="pill-btn" data-toggle="top" type="button">常驻置顶</button>
        </div>
      </div>

      <div class="pop-group">
        <div class="pop-head">
          <span class="pop-label">音量与位置</span>
          <span id="volume-val" class="pop-meta tabular">70%</span>
        </div>
        <input id="volume-slider" class="warm-slider" type="range" min="0" max="100" step="5" value="70" aria-label="音量">
        <div class="pill-grid-4">
          <button class="pill-btn" data-action="dock" data-value="left" type="button">左下</button>
          <button class="pill-btn" data-action="dock" data-value="right" type="button">右下</button>
          <button class="pill-btn" data-action="center" type="button">居中</button>
          <button class="pill-btn" data-action="reset" type="button">复位</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <button id="btn-visible" class="footer-btn" data-action="toggle" type="button">隐藏宠物</button>
    <button class="footer-btn" data-action="typing" type="button">试打</button>
    <button class="quit-btn" data-action="quit" type="button">退出</button>
  </footer>
</div>
<script type="module" src="menu.js"></script>
</body>
</html>
