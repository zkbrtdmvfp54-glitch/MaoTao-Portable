        const bl = kb.project(-1 - padFrame, 1.06);

        // 底座厚实暖木色侧面（2.5D立体桌面厚度）
        const thickness = 11;
        traceRoundedQuad(ctx, [
          { x: tl.x, y: tl.y + thickness },
          { x: tr.x, y: tr.y + thickness },
          { x: br.x, y: br.y + thickness },
          { x: bl.x, y: bl.y + thickness }
        ], 14);
        ctx.fillStyle = '#C9AA85';
        ctx.fill();
        ctx.strokeStyle = '#3E2B23';
        ctx.lineWidth = 2.4;
        ctx.stroke();

        // 键盘奶油暖木框体顶面
        traceRoundedQuad(ctx, [tl, tr, br, bl], 13);
        const frameGrad = ctx.createLinearGradient(0, tl.y, 0, bl.y);
        frameGrad.addColorStop(0, '#EFE0C9');
        frameGrad.addColorStop(0.5, '#E7D3B7');
        frameGrad.addColorStop(1, '#DBC1A0');
        ctx.fillStyle = frameGrad;
        ctx.fill();
        ctx.strokeStyle = '#3E2B23';
        ctx.lineWidth = 2.4;
        ctx.stroke();

        // 键盘内凹槽柔和阴影
        const inTL = kb.project(-0.97, 0.04);
        const inTR = kb.project(0.97, 0.04);
        const inBR = kb.project(0.97, 0.96);
        const inBL = kb.project(-0.97, 0.96);
        traceRoundedQuad(ctx, [inTL, inTR, inBR, inBL], 8);
        ctx.fillStyle = 'rgba(98, 71, 51, 0.16)';
        ctx.fill();

        // 逐个绘制透视键帽（从面向猫咪的最上排空格行 -> 最下排数字行）
        for (const k of kb.keys) {
          const pressShift = k.press * 3.4;

          // 键帽色调配比：空格键为暖奶油黄/杏色，回车/Esc 为珊瑚橘粉彩，功能键为燕麦奶咖，字母键为奶油白
          let topColor = '#FFFBF2';
          let sideColor = '#DFD1BC';
          if (k.type === 'space') {
            topColor = '#FCE29E';
            sideColor = '#DCB96B';
          } else if (k.type === 'accent') {
            topColor = '#F8BEA5';
            sideColor = '#D69478';
          } else if (k.type === 'mod') {
            topColor = '#F4E8D6';
            sideColor = '#D4C2A8';
          }

          // 1) 键帽立体底部阴影层
          const sideQuad = k.quad.map((pt) => ({ x: pt.x, y: pt.y + 3.6 }));
          traceRoundedQuad(ctx, sideQuad, 4.2);
          ctx.fillStyle = sideColor;
          ctx.fill();
          ctx.strokeStyle = 'rgba(62, 43, 35, 0.42)';
          ctx.lineWidth = 1.1;
          ctx.stroke();

          // 2) 键帽顶面（按下时真实下沉并泛起暖水彩光晕）
          const topQuad = k.quad.map((pt) => ({ x: pt.x, y: pt.y + pressShift }));
          traceRoundedQuad(ctx, topQuad, 4.0);
          ctx.fillStyle = topColor;
          ctx.fill();

          if (k.glow > 0.02) {
            ctx.fillStyle = `rgba(255, 212, 118, ${k.glow * 0.62})`;
            ctx.fill();
          }

          ctx.strokeStyle = k.glow > 0.1 ? '#B86A38' : 'rgba(62, 43, 35, 0.55)';
          ctx.lineWidth = k.glow > 0.1 ? 1.5 : 1.15;
          ctx.stroke();

          // 3) 键帽顶面柔和手绘字符标注（清秀淡棕色）
          ctx.save();
          ctx.fillStyle = k.glow > 0.2 ? '#6E3C1E' : 'rgba(104, 77, 59, 0.72)';
          const fontSize = k.label.length > 2 ? 6.8 : 8.4;
          ctx.font = `600 ${fontSize}px "Fredoka", "Noto Sans SC", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(k.label, k.cx, k.cy + pressShift + 0.3);
          ctx.restore();
        }

        ctx.restore();
      }

      /** 5. 绘制键帽敲击点的细腻水彩涟漪与手绘小星芒 */
      drawKeyRipples(ctx) {
        for (const r of this.keyRipples) {
          const p = clamp(r.age / r.duration, 0, 1);
          const alpha = 1 - smoothstep(0.15, 1, p);
          const rad = lerp(4, 23, 1 - Math.pow(1 - p, 2.5));

          ctx.save();
          ctx.translate(r.x, r.y);
          ctx.globalAlpha = alpha * 0.78;

          // 柔和扩散水彩涟漪圈
          ctx.beginPath();
          ctx.ellipse(0, 0, rad, rad * 0.62, 0, 0, Math.PI * 2);
          ctx.strokeStyle = r.color;
          ctx.lineWidth = 2.0 * (1 - p * 0.6);
          ctx.stroke();

          // 绽放的小手绘四角星芒
          for (const sp of r.sparks) {
            const d = sp.dist * (0.25 + 0.85 * (1 - Math.pow(1 - p, 2)));
            const sx = Math.cos(sp.ang) * d;
            const sy = Math.sin(sp.ang) * d * 0.68 - p * 6;
            ctx.fillStyle = r.color;
            this.drawFourPointStar(ctx, sx, sy, sp.size * (1 - p * 0.55));
          }
          ctx.restore();
        }
      }

      /** 6. 绘制暹罗猫海豹重点色双臂与弹性软爪 */
      drawArmsAndPaws(ctx, breathe, bodyLift) {
        const l = this.lean;
        const shoulderY = -22 + breathe - bodyLift;

        // 画面左侧肩膀（猫咪右手）与画面右侧肩膀（猫咪左手）
        const leftShoulderX = -32 - l * 22;
        const rightShoulderX = 36 - l * 16;

        this.drawSiameseArm(ctx, leftShoulderX, shoulderY, this.leftPaw);
        this.drawSiameseArm(ctx, rightShoulderX, shoulderY, this.rightPaw);
      }

      /** 绘制单条暹罗猫手臂：肩部奶油色平滑过渡到前臂与圆润猫爪的深巧克力棕重点色 */
      drawSiameseArm(ctx, sx, sy, paw) {
        const px = paw.x;
        const py = paw.y;
        const dx = px - sx;
        const dy = py - sy;
        const len = Math.max(1, Math.hypot(dx, dy));
        const nx = -dy / len;
        const ny = dx / len;

        // 手臂自然弧度与微锥度
        const wTop = 14.5;
        const wWrist = 11.2;

        ctx.save();

        // 悬空敲击时在键盘上投影一点温柔阴影
        if (paw.liftZ > 0.08) {
          ctx.fillStyle = `rgba(62, 43, 35, ${0.14 * (1 - paw.liftZ * 0.4)})`;
          ctx.beginPath();
          ctx.ellipse(px, py + 12 + paw.liftZ * 6, 13, 6, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // 1) 绘制手臂主体（从肩部奶油米白渐变到下段海豹咖啡棕）
        const armGrad = ctx.createLinearGradient(sx, sy, px, py);
        armGrad.addColorStop(0, '#F6EBD8');
        armGrad.addColorStop(0.32, '#DEC8AC');
        armGrad.addColorStop(0.68, '#6B4D3D');
        armGrad.addColorStop(1, '#4A352A');

        ctx.beginPath();
        ctx.moveTo(sx + nx * wTop, sy + ny * wTop);
        ctx.quadraticCurveTo(
          (sx + px) * 0.5 + nx * (wTop + wWrist) * 0.48,
          (sy + py) * 0.5 + ny * (wTop + wWrist) * 0.48,
          px + nx * wWrist,
          py + ny * wWrist
        );
        ctx.lineTo(px - nx * wWrist, py - ny * wWrist);
        ctx.quadraticCurveTo(
          (sx + px) * 0.5 - nx * (wTop + wWrist) * 0.48,
          (sy + py) * 0.5 - ny * (wTop + wWrist) * 0.48,
          sx - nx * wTop,
          sy - ny * wTop
        );
        ctx.closePath();
        ctx.fillStyle = armGrad;
        ctx.fill();

        // 两侧柔顺可可棕手臂描边（肩部开放，自然融入身体毛色）
        ctx.beginPath();
        ctx.moveTo(sx + nx * wTop, sy + ny * wTop);
        ctx.quadraticCurveTo(
          (sx + px) * 0.5 + nx * (wTop + wWrist) * 0.48,
          (sy + py) * 0.5 + ny * (wTop + wWrist) * 0.48,
          px + nx * wWrist,
          py + ny * wWrist
        );
        ctx.moveTo(sx - nx * wTop, sy - ny * wTop);
        ctx.quadraticCurveTo(
          (sx + px) * 0.5 - nx * (wTop + wWrist) * 0.48,
          (sy + py) * 0.5 - ny * (wTop + wWrist) * 0.48,
          px - nx * wWrist,
          py - ny * wWrist
        );
        ctx.strokeStyle = '#3E2B23';
        ctx.lineWidth = 2.4;
        ctx.lineCap = 'round';
        ctx.stroke();

        // 2) 圆润巧克力棕猫爪末端（支持敲击瞬间的 squash & stretch 挤压弹性变形）
        ctx.translate(px, py);
        ctx.scale(paw.squashX, paw.squashY);

        const pawGrad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 15);
        pawGrad.addColorStop(0, '#6B4D3D');
        pawGrad.addColorStop(0.65, '#4A352A');
        pawGrad.addColorStop(1, '#3D2A21');

        ctx.beginPath();
        ctx.ellipse(0, 1, 13.5, 11.8, 0, 0, Math.PI * 2);
        ctx.fillStyle = pawGrad;
        ctx.fill();
        ctx.strokeStyle = '#3E2B23';
        ctx.lineWidth = 2.4;
        ctx.stroke();

        // 可爱三小趾缝细线
        ctx.strokeStyle = 'rgba(246, 235, 216, 0.25)';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(-4.5, 8);
        ctx.lineTo(-4.5, 11.5);
        ctx.moveTo(4.5, 8);
        ctx.lineTo(4.5, 11.5);
        ctx.stroke();

        ctx.restore();
      }

      /** 7. 绘制原地升起的三段式「敲击 -> 悬浮 -> 渐变消散」字母 */
      drawFloatingLetters(ctx) {
        for (const fl of this.floatingLetters) {
          const tf = this.evaluateLetterTransform(fl);
          if (tf.alpha <= 0.01) continue;

          ctx.save();
          ctx.translate(tf.x, tf.y);
          ctx.rotate(tf.rot);
          ctx.scale(tf.scale, tf.scale);
          ctx.globalAlpha = tf.alpha;

          const isLong = fl.label.length > 2;
          ctx.font = `700 ${isLong ? 12.5 : 16.5}px "Fredoka", "Noto Sans SC", sans-serif`;
          const textW = ctx.measureText(fl.label).width;
          const pillW = Math.max(27, textW + 14);
          const pillH = 26;

          // 1) 柔和暖水彩光晕背景
          if (tf.glowAlpha > 0.02) {
            const halo = ctx.createRadialGradient(0, 0, 3, 0, 0, pillW * 0.85);
            halo.addColorStop(0, fl.palette.glow);
            halo.addColorStop(1, 'rgba(255, 232, 180, 0)');
            ctx.save();
            ctx.globalAlpha = tf.alpha * tf.glowAlpha;
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(0, 0, pillW * 0.85, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 2) 手绘绘本小圆牌底色（渐隐期柔美过渡为暖粉彩）
          ctx.beginPath();
          ctx.roundRect(-pillW * 0.5, -pillH * 0.5, pillW, pillH, 10);
          ctx.fillStyle = tf.fadeMix > 0.35 ? fl.palette.fade : fl.palette.bg;
          ctx.fill();
          ctx.strokeStyle = '#3E2B23';
          ctx.lineWidth = 1.9;
          ctx.stroke();

          // 3) 清晰温柔字符
          ctx.fillStyle = tf.fadeMix > 0.5 ? '#FFFDF8' : fl.palette.fg;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(fl.label, 0, 0.8);

          ctx.restore();
        }
      }

      /** 8. 绘制彩铅星尘、水彩爱心、瞌睡 Zzz、惊吓叹号与对话气泡 */
      drawParticles(ctx) {
        for (const pt of this.particles) {
          ctx.save();
          ctx.globalAlpha = clamp(pt.life, 0, 1);
          ctx.translate(pt.x, pt.y);
          ctx.rotate(pt.rot);

          if (pt.type === 'heart') {
            const s = pt.size * (0.75 + (1 - pt.life) * 0.38);
            ctx.fillStyle = pt.color;
            ctx.strokeStyle = 'rgba(62, 43, 35, 0.55)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(0, s * 0.3);
            ctx.bezierCurveTo(-s * 0.65, -s * 0.3, -s, s * 0.25, 0, s * 0.95);
            ctx.bezierCurveTo(s, s * 0.25, s * 0.65, -s * 0.3, 0, s * 0.3);
            ctx.fill();
            ctx.stroke();
          } else if (pt.type === 'stardust') {
            ctx.fillStyle = pt.color;
            this.drawFourPointStar(ctx, 0, 0, pt.size * (0.6 + pt.life * 0.6));
          } else if (pt.type === 'zzz') {
            const sc = 0.82 + (1 - pt.life) * 0.45;
            ctx.scale(sc, sc);
            ctx.font = '700 15px "Fredoka", sans-serif';
            ctx.strokeStyle = '#FFFBF2';
            ctx.lineWidth = 3.5;
            ctx.strokeText(pt.text, 0, 0);
            ctx.fillStyle = '#6B88C8';
            ctx.fillText(pt.text, 0, 0);
          } else if (pt.type === 'exclaim') {
            const sc = 0.85 + Math.sin(pt.life * Math.PI) * 0.35;
            ctx.scale(sc, sc);
            ctx.font = '700 22px "Fredoka", sans-serif';
            ctx.strokeStyle = '#FFFBF2';
            ctx.lineWidth = 4;
            ctx.strokeText('!', 0, 0);
            ctx.fillStyle = '#E87A64';
            ctx.fillText('!', 0, 0);
          } else if (pt.type === 'bubble') {
            ctx.font = '600 12px "Fredoka", "Noto Sans SC", sans-serif';
            const tw = ctx.measureText(pt.text).width;
            ctx.beginPath();
            ctx.roundRect(-tw * 0.5 - 9, -12, tw + 18, 23, 11);
            ctx.fillStyle = '#FFFBF2';
            ctx.fill();
            ctx.strokeStyle = '#3E2B23';
            ctx.lineWidth = 1.6;
            ctx.stroke();

            ctx.fillStyle = '#4A352A';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(pt.text, 0, -0.5);
          }

          ctx.restore();
        }
      }

      /** 辅助绘制柔和手绘四角星芒 */
      drawFourPointStar(ctx, cx, cy, r) {
        ctx.beginPath();
        ctx.moveTo(cx, cy - r);
        ctx.quadraticCurveTo(cx + r * 0.18, cy - r * 0.18, cx + r, cy);
        ctx.quadraticCurveTo(cx + r * 0.18, cy + r * 0.18, cx, cy + r);
        ctx.quadraticCurveTo(cx - r * 0.18, cy + r * 0.18, cx - r, cy);
        ctx.quadraticCurveTo(cx - r * 0.18, cy - r * 0.18, cx, cy - r);
        ctx.closePath();
        ctx.fill();
      }
    }

    /**
     * ============================================================================
     * 4. 页面启动与全局交互绑定
     * ============================================================================
     */
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('pet-canvas');
      const statKeys = document.getElementById('stat-keys');
      const statClicks = document.getElementById('stat-clicks');
      const guideText = document.getElementById('guide-text');
      const guidePill = document.getElementById('guide-pill');
      const statusDot = document.getElementById('status-dot');

      const btnSound = document.getElementById('btn-sound');
      const soundIcon = document.getElementById('sound-icon');
      const soundText = document.getElementById('sound-text');

      const btnViewMode = document.getElementById('btn-view-mode');
      const viewModeText = document.getElementById('view-mode-text');

      const btnToggleMore = document.getElementById('btn-toggle-more');
      const moreMenu = document.getElementById('more-menu');

      const imeInput = document.getElementById('ime-input');
      const inputCapsule = document.getElementById('input-capsule');
      const btnHideInput = document.getElementById('btn-hide-input');
      const btnShowInput = document.getElementById('btn-show-input');

      const sound = new StorybookSound();
      const pet = new SiameseCatPet(canvas, sound, {
        onStats: (st) => {
          statKeys.textContent = st.keys.toLocaleString();
          statClicks.textContent = st.clicks.toLocaleString();
        },
        onStatus: (msg, sleeping) => {
          guideText.textContent = msg;
          statusDot.className = sleeping
            ? 'w-2 h-2 rounded-full bg-[#8DA6E8] shadow-[0_0_6px_#8DA6E8]'
            : 'w-2 h-2 rounded-full bg-[#69B8F8] shadow-[0_0_6px_#69B8F8]';
        }
      });

      // 初始化今日计数显示
      statKeys.textContent = pet.stats.keys.toLocaleString();
      statClicks.textContent = pet.stats.clicks.toLocaleString();

      // 响应式窗口变化
      window.addEventListener('resize', () => pet.resize());

      // 全局指针事件（桌面鼠标与移动端触控兼容）
      window.addEventListener('pointermove', (e) => {
        pet.handlePointerMove(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('pointerdown', (e) => {
        pet.handlePointerDown(e.clientX, e.clientY, e.target);
      });

      window.addEventListener('pointerup', () => pet.handlePointerUp());
      window.addEventListener('pointercancel', () => pet.handlePointerUp());

      // 全局键盘监听（无需聚焦任何输入框即可直接敲击！）
      let lastRepeatAt = 0;
      let isComposingIME = false;

      imeInput.addEventListener('compositionstart', () => { isComposingIME = true; });
      imeInput.addEventListener('compositionend', (e) => {
        isComposingIME = false;
        const text = (e.data || '').trim();
        if (text) {
          // 中文词组上屏时逐字错开极短间隔，触发灵动的连敲与汉字升起动画
          const chars = Array.from(text).slice(-6);
          chars.forEach((ch, idx) => {
            setTimeout(() => {
              pet.handleKeyPress(ch, '', ch);
            }, idx * 75);
          });
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.isComposing || isComposingIME || e.key === 'Process') {
          // 拼音选词按键时也同步轻敲对应字母键
          if (e.code && e.code.startsWith('Key')) {
            pet.handleKeyPress(e.key, e.code);
          }
          return;
        }
        if (e.repeat) {
          const now = performance.now();
          if (now - lastRepeatAt < 78) return;
          lastRepeatAt = now;
        }
        pet.handleKeyPress(e.key, e.code);
      });

      // 兼容手机端虚拟软键盘输入
      let prevInputVal = '';
      imeInput.addEventListener('input', (e) => {
        const val = imeInput.value;
        if (!isComposingIME && val.length > prevInputVal.length) {
          const added = val.slice(prevInputVal.length);
          // 若 65ms 内未由物理 keydown 触发，则为移动虚拟键盘输入
          if (added && performance.now() - pet.lastKeyTime > 65) {
            const ch = added.slice(-1);
            pet.handleKeyPress(ch, '', ch);
          }
        }
        prevInputVal = val;
        if (val.length > 50) {
          imeInput.value = val.slice(-24);
          prevInputVal = imeInput.value;
        }
      });

      // --- 右上角悬浮条交互 ---
      btnSound.addEventListener('click', () => {
        const next = !sound.enabled;
        sound.setEnabled(next);
        soundIcon.textContent = next ? '🔊' : '🔇';
        soundText.textContent = next ? '音效开' : '静音';
      });

      btnViewMode.addEventListener('click', () => {
        const mode = pet.toggleViewMode();
        viewModeText.textContent = mode === 'cat' ? '猫咪视角' : '镜像左右';
      });

      btnToggleMore.addEventListener('click', () => {
        moreMenu.classList.toggle('hidden');
      });

      document.getElementById('act-pet').addEventListener('click', () => pet.triggerPet(true));
      document.getElementById('act-poke').addEventListener('click', () => pet.triggerPoke('nose'));
      document.getElementById('act-sleep').addEventListener('click', () => pet.toggleSleep());
      document.getElementById('act-reset').addEventListener('click', () => pet.resetPosition());

      // 4 套绘本背景主题切换
      const themeDots = document.querySelectorAll('.theme-dot');
      themeDots.forEach((dot) => {
        dot.addEventListener('click', () => {
          const theme = dot.dataset.theme;
          document.body.classList.remove('theme-cream', 'theme-mint', 'theme-night', 'theme-green');
          document.body.classList.add('theme-' + theme);
          pet.setTheme(theme);

          themeDots.forEach((d) => d.classList.remove('ring-2', 'ring-[#E89B72]'));
          dot.classList.add('ring-2', 'ring-[#E89B72]');

          // OBS 绿幕模式下自动弱化底部文字提示，方便直播抠图
          guidePill.style.opacity = theme === 'green' ? '0' : '0.85';
        });
      });

      // 底部便携输入条收起/展开
      btnHideInput.addEventListener('click', () => {
        inputCapsule.classList.add('hidden');
        btnShowInput.classList.remove('hidden');
      });
      btnShowInput.addEventListener('click', () => {
        btnShowInput.classList.add('hidden');
        inputCapsule.classList.remove('hidden');
        imeInput.focus();
      });

      // 启动 60fps 丝滑绘本动画主循环
      let prevTime = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - prevTime) / 1000);
        prevTime = now;
        pet.update(dt, now);
        pet.render(now);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    });
  </script>
</body>
</html>
